# Single-VM production topology for Oracle A1 (linux/arm64).
# Only the web proxy exposes ports; API, worker and MySQL stay on the Compose network.
name: salon-spot-production

services:
  mysql:
    image: mysql:8.4
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-production-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migration-runtime
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    working_dir: /app/apps/api
    command:
      - sh
      - -ec
      - |
        test -x ./node_modules/.bin/prisma
        set +e
        for attempt in 1 2 3; do
          ./node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
          status=$$?
          if [ "$$status" -eq 0 ]; then exit 0; fi
          echo "prisma_migrate_retry attempt=$$attempt status=$$status"
          if [ "$$attempt" -lt 3 ]; then sleep 2; fi
        done
        exit "$$status"
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api-runtime
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/main.js"]
    volumes:
      - media-production-data:/data/media
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: api-runtime
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["node", "apps/api/dist/worker-main.js"]
    volumes:
      - media-production-data:/data/media
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/worker/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 70s
    restart: unless-stopped
    stop_grace_period: 25s

  web:
    build:
      context: .
      target: web-runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/cloudflare-origin.pem:/etc/nginx/tls/origin.pem:ro
      - ./secrets/cloudflare-origin.key:/etc/nginx/tls/origin.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  mysql-production-data:
  media-production-data:
