name: Release gate P1

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-assurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      DATABASE_URL: mysql://salon_spot:salon_spot@127.0.0.1:3307/salon_spot
      JWT_ACCESS_SECRET: ci-only-jwt-secret-must-be-at-least-thirty-two-characters
      REFRESH_TOKEN_PEPPER: ci-only-refresh-pepper-must-be-at-least-thirty-two-characters
      MEDIA_UPLOAD_SECRET: ci-only-media-secret-must-be-at-least-thirty-two-characters
      MEDIA_STORAGE_ROOT: .data/ci-media
      P1_RUNTIME_ARTIFACT_DIR: artifacts/p1-runtime-smoke/ci-${{ github.run_id }}
      P1_BROWSER_ARTIFACT_DIR: artifacts/p1-browser/ci-${{ github.run_id }}
      P1_ARTIFACT_DIR: artifacts/p1-backup-restore/ci-${{ github.run_id }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: salon_spot
          MYSQL_USER: salon_spot
          MYSQL_PASSWORD: salon_spot
          MYSQL_ROOT_PASSWORD: ci_root_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -pci_root_only"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record candidate identity
        run: |
          mkdir -p artifacts/ci
          node -e "require('node:fs').writeFileSync('artifacts/ci/candidate.json', JSON.stringify({sha: process.env.GITHUB_SHA, ref: process.env.GITHUB_REF, runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, runUrl: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID}, null, 2) + '\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm prisma:generate
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck
        run: pnpm typecheck
      - name: API and web tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Prisma deploy and mandatory MySQL E2E
        run: |
          mkdir -p artifacts/p1-mysql-e2e
          set -o pipefail
          pnpm p1:mysql 2>&1 | tee artifacts/p1-mysql-e2e/test.log
      - name: P0 runtime recovery smoke
        run: pnpm p1:runtime-smoke
      - name: Browser release journeys
        run: pnpm p1:browser
      - name: Backup and restore rehearsal
        env:
          # The GitHub runner is dedicated to this one job; keep a fixed name so
          # the always-run diagnostic and cleanup steps can address the stack.
          P1_BACKUP_COMPOSE_PROJECT: salon-spot-p1-backup
        run: pnpm p1:backup-restore
      - name: Verify release evidence bundle
        run: node scripts/p1/verify-release-evidence.mjs
      - name: Save release diagnostics
        if: always()
        run: |
          mkdir -p artifacts/ci
          docker compose --project-name salon-spot-p1-backup -f compose.p1-backup.yaml ps > artifacts/ci/backup-restore-ps.txt || true
          docker compose --project-name salon-spot-p1-backup -f compose.p1-backup.yaml logs --no-color > artifacts/ci/backup-restore.log || true
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-release-evidence-${{ github.run_id }}
          if-no-files-found: error
          path: |
            artifacts/
            test-results/
            playwright-report/
      - name: Dispose runtime and rehearsal databases
        if: always()
        run: |
          docker compose --project-name salon-spot-p1-backup -f compose.p1-backup.yaml down --volumes || true
